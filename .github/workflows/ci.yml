name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '26.8.1'

    - name: Install app-server test dependencies
      run: npm ci --prefix tests/fixtures/codex-app-server --ignore-scripts --no-audit --no-fund

    - name: Install exec CLI test dependencies
      if: runner.os != 'Windows'
      run: npm ci --prefix tests/fixtures/codex-cli --ignore-scripts --no-audit --no-fund

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Debug

    - name: Test
      run: dotnet test --no-build --configuration Debug --verbosity normal

    - name: Pack NuGet packages (Release)
      if: matrix.os == 'ubuntu-latest'
      run: |
        # Build and pack CodexSdk
        dotnet build src/CodexSdk/CodexSdk.csproj -c Release
        dotnet pack src/CodexSdk/CodexSdk.csproj -c Release --no-build

        # Build and pack CodexSdk.AppServer
        dotnet build src/CodexSdk.AppServer/CodexSdk.AppServer.csproj -c Release
        dotnet pack src/CodexSdk.AppServer/CodexSdk.AppServer.csproj -c Release --no-build

        # Add local package sources for framework packages to find their SDK dependencies
        dotnet nuget add source "$GITHUB_WORKSPACE/src/CodexSdk/bin/Release" --name local-temp
        dotnet nuget add source "$GITHUB_WORKSPACE/src/CodexSdk.AppServer/bin/Release" --name local-app-server

        # Build and pack CodexSdk.MAF
        dotnet build src/CodexSdk.MAF/CodexSdk.MAF.csproj -c Release
        dotnet pack src/CodexSdk.MAF/CodexSdk.MAF.csproj -c Release --no-build

        # Build and pack CodexSdk.AppServer.MAF
        dotnet build src/CodexSdk.AppServer.MAF/CodexSdk.AppServer.MAF.csproj -c Release
        dotnet pack src/CodexSdk.AppServer.MAF/CodexSdk.AppServer.MAF.csproj -c Release --no-build
  ci-success:
    name: CI Success
    needs: build-and-test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Verify matrix jobs
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            exit 1
          fi
