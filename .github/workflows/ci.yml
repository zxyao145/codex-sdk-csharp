name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Debug

    - name: Test
      run: dotnet test --no-build --configuration Debug --verbosity normal

    - name: Pack NuGet packages (Release)
      if: matrix.os == 'ubuntu-latest'
      run: |
        # Build and pack CodexSdk first
        dotnet build src/CodexSdk/CodexSdk.csproj -c Release
        dotnet pack src/CodexSdk/CodexSdk.csproj -c Release --no-build

        # Add local package source for CodexSdk.MAF to find CodexSdk (use absolute path)
        dotnet nuget add source "$GITHUB_WORKSPACE/src/CodexSdk/bin/Release" --name local-temp

        # Build and pack CodexSdk.MAF with local source
        dotnet build src/CodexSdk.MAF/CodexSdk.MAF.csproj -c Release
        dotnet pack src/CodexSdk.MAF/CodexSdk.MAF.csproj -c Release --no-build
  ci-success:
    name: CI Success
    needs: build-and-test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Verify matrix jobs
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            exit 1
          fi
